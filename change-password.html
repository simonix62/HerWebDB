<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#32373d">
  <title>HerWebDB · Change password</title>
  <style>
    @font-face { font-family: Poppins; src: url("bootstrap-sidebar-09/fonts/poppins-400-latin.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
    @font-face { font-family: Poppins; src: url("bootstrap-sidebar-09/fonts/poppins-500-latin.woff2") format("woff2"); font-style: normal; font-weight: 500; font-display: swap; }
    @font-face { font-family: Poppins; src: url("bootstrap-sidebar-09/fonts/poppins-600-latin.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: swap; }
    :root { color-scheme: light; --ink:#202b38; --muted:#718094; --blue:#2f89fc; --blue-deep:#1f6fd1; --line:#e8edf3; --surface:#ffffff; --canvas:#dbe2ec; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Poppins,"Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.6; display:grid; place-items:center; padding:24px; min-height:100vh; }
    .card { width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:15px; padding:30px 26px; box-shadow:0 12px 36px rgba(36,58,85,.06); }
    h1 { margin:0 0 6px; font-size:22px; font-weight:500; color:#202b38; letter-spacing:-.02em; }
    p { margin:0 0 18px; color:#718094; font-size:13px; }
    .form-row { display:grid; gap:6px; margin-bottom:12px; }
    .form-row label { font-size:12px; color:#536a84; font-weight:500; }
    .form-row input { padding:9px 12px; border:1px solid #e1e7ef; border-radius:8px; background:#fff; color:#344254; width:100%; }
    .btn { width:100%; padding:10px 16px; border:0; border-radius:8px; background:var(--blue); color:#fff; cursor:pointer; font-size:13px; margin-top:6px; }
    .result { margin-top:12px; padding:10px 12px; border-radius:8px; background:#fdecea; color:#a63a3a; font-size:12px; display:none; }
    .result.show { display:block; }
    .result.ok { background:#eaf6ea; color:#2e6b3a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Change password</h1>
    <p id="hint">Update your password. Minimum 6 characters.</p>
    <div class="form-row">
      <label for="current">Current password (optional if forced)</label>
      <input id="current" type="password" autocomplete="current-password" />
    </div>
    <div class="form-row">
      <label for="newpw">New password</label>
      <input id="newpw" type="password" autocomplete="new-password" />
    </div>
    <div class="form-row">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" />
    </div>
    <button class="btn" id="changeBtn">Change password</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    (() => {
      const originalFetch = window.fetch;
      window.fetch = function(url, options) {
        options = options || {};
        if (!options.credentials) options.credentials = 'include';
        return originalFetch(url, options);
      };
      const result = document.getElementById("result");
      function show(msg, ok){ result.textContent=msg; result.classList.add("show"); result.classList.toggle("ok", !!ok); result.classList.toggle("error", !ok); }
      async function change(){
        const current = document.getElementById("current").value;
        const newpw = document.getElementById("newpw").value;
        const confirm = document.getElementById("confirm").value;
        if(newpw !== confirm){ show("Passwords do not match.", false); return; }
        try {
          const res = await fetch("/api/change-password", { method:"POST", headers:{"Content-Type":"application/json"}, credentials: 'include', body:JSON.stringify({current, newPassword:newpw}) });
          const data = await res.json();
          if(!res.ok) throw new Error(data.error||"Change failed");
          show("Password changed. Redirecting...", true);
          setTimeout(()=>{ window.location.href = "index.html"; }, 1200);
        } catch(err){ show(err.message, false); }
      }
      document.getElementById("changeBtn").addEventListener("click", change);
    })();
  </script>
</body>
</html>
