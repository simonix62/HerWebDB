<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#32373d">
  <title>HerWebDB · Login</title>
  <style>
    @font-face { font-family: Poppins; src: url("bootstrap-sidebar-09/fonts/poppins-400-latin.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
    @font-face { font-family: Poppins; src: url("bootstrap-sidebar-09/fonts/poppins-500-latin.woff2") format("woff2"); font-style: normal; font-weight: 500; font-display: swap; }
    @font-face { font-family: Poppins; src: url("bootstrap-sidebar-09/fonts/poppins-600-latin.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: swap; }
    :root { color-scheme: light; --ink:#202b38; --muted:#718094; --blue:#2f89fc; --blue-deep:#1f6fd1; --line:#e8edf3; --surface:#ffffff; --canvas:#dbe2ec; }
    * { box-sizing: border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Poppins,"Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.6; display:grid; place-items:center; padding:24px; }
    .card { width:100%; max-width:380px; background:#fff; border:1px solid var(--line); border-radius:15px; padding:30px 26px; box-shadow:0 12px 36px rgba(36,58,85,.06); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .brand-mark { display:grid; width:34px; height:34px; place-items:center; border:1px solid rgba(47,137,252,.3); border-radius:11px; background:#eef6ff; color:#1f6fd1; }
    .brand-mark svg { width:19px; height:19px; }
    .brand-name { font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#394657; }
    h1 { margin:0 0 6px; font-size:22px; font-weight:500; color:#202b38; letter-spacing:-.02em; }
    p { margin:0 0 18px; color:#718094; font-size:13px; }
    .form-row { display:grid; gap:6px; margin-bottom:12px; }
    .form-row label { font-size:12px; color:#536a84; font-weight:500; }
    .form-row input { padding:9px 12px; border:1px solid #e1e7ef; border-radius:8px; background:#fff; color:#344254; width:100%; }
    .btn { width:100%; padding:10px 16px; border:0; border-radius:8px; background:var(--blue); color:#fff; cursor:pointer; font-size:13px; margin-top:6px; }
    .result { margin-top:12px; padding:10px 12px; border-radius:8px; background:#fdecea; color:#a63a3a; font-size:12px; display:none; }
    .result.show { display:block; }
    .result.ok { background:#eaf6ea; color:#2e6b3a; }
    .hint { margin-top:14px; font-size:11px; color:#9aa5b2; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5V8.8L12 3l8 5.8v10.7h-5.3v-6.2H9.3v6.2H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">HerWebDB</span>
    </div>
    <h1>Sign in</h1>
    <p>Access to the directory requires an account.</p>
    <div class="form-row">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>
    <button class="btn" id="loginBtn">Sign in</button>
    <div class="result" id="result"></div>
    <div class="hint">Default admin: admin / admin (change after first login)</div>
  </div>

  <script>
    (() => {
      const originalFetch = window.fetch;
      window.fetch = function(url, options) {
        options = options || {};
        if (!options.credentials) options.credentials = 'include';
        return originalFetch(url, options);
      };
      const result = document.getElementById("result");
      function show(msg, ok){ result.textContent=msg; result.classList.add("show"); result.classList.toggle("ok", !!ok); result.classList.toggle("error", !ok); }
      async function tryLogin(){
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        try {
          const res = await fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username,password}) });
          const data = await res.json();
          if(!res.ok) throw new Error(data.error||"Login failed");
          if(data.mustChange){ window.location.href = "change-password.html"; return; }
          if(data.user.status !== 'confirmed'){ show("Your account is waiting for administrator approval.", false); return; }
          window.location.href = "index.html";
        } catch(err){ show(err.message, false); }
      }
      document.getElementById("loginBtn").addEventListener("click", tryLogin);
      document.getElementById("password").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
      // if already logged in, go home only if confirmed; otherwise show waiting message
      fetch("/api/me").then(r=>{
        if(r.ok) return r.json();
        return null;
      }).then(data=>{
        if(data && data.user){
          if(data.user.status === 'confirmed'){ window.location.href="index.html"; return; }
          show("Your account is waiting for administrator approval. Please contact the admin.", false);
        }
      }).catch(()=>{});
      // show waiting message if redirected from a protected page
      const params = new URLSearchParams(window.location.search);
      if(params.get('waiting') === '1'){ show("Your account is waiting for administrator approval. Please contact the admin.", false); }
    })();
  </script>
</body>
</html>
